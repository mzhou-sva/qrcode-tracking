<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>desktop top-down</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="webcam" autoplay playsinline muted></video>
  <div id="zone" class="zone" hidden></div>
  <canvas id="overlay"></canvas>

  <div id="hud">
    <div class="whisper">
      <p>S N A C K &nbsp;·&nbsp; B E A T &nbsp;·&nbsp; M A C H I N E</p>
      <p>Put a snack on the table to start playing.</p>
    </div>
    <div class="bar" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <ul class="snacks">
      <li class="snack" data-name="water" data-phase="stopped"><i class="dot"></i><b>Water</b><em>Stopped</em></li>
      <li class="snack" data-name="candy" data-phase="stopped"><i class="dot"></i><b>Candy</b><em>Stopped</em></li>
      <li class="snack" data-name="cookie" data-phase="stopped"><i class="dot"></i><b>Cookie</b><em>Stopped</em></li>
    </ul>
  </div>

  <div id="controls" class="controls">
    <button type="button" id="controlsToggle" class="controls-toggle" aria-expanded="true" aria-controls="controlsBody">Controls</button>
    <div id="controlsBody" class="controls-body">
    <div class="row camera-row" id="cameraRow" hidden>
      <span class="row-label">Camera</span>
      <select id="cameraSelect" aria-label="Camera"></select>
    </div>
    <div class="row">
      <span class="row-label">By object</span>
      <button type="button" data-by="object" data-item="water" aria-pressed="false">Water</button>
      <button type="button" data-by="object" data-item="candy" aria-pressed="false">Candy</button>
      <button type="button" data-by="object" data-item="cookie" aria-pressed="false">Cookie</button>
    </div>
    <div class="row">
      <span class="row-label">By sound</span>
      <button type="button" data-by="sound" data-item="water" aria-pressed="false">Gulp</button>
      <button type="button" data-by="sound" data-item="candy" aria-pressed="false">Crackle</button>
      <button type="button" data-by="sound" data-item="cookie" aria-pressed="false">Crunch</button>
    </div>
    <div class="row where-row">
      <span class="row-label">Where</span>
      <div class="where-grid">
        <button type="button" data-row="0" data-col="0" aria-pressed="false"></button>
        <button type="button" data-row="0" data-col="1" aria-pressed="false"></button>
        <button type="button" data-row="0" data-col="2" aria-pressed="false"></button>
        <button type="button" data-row="1" data-col="0" aria-pressed="false"></button>
        <button type="button" data-row="1" data-col="1" aria-pressed="false"></button>
        <button type="button" data-row="1" data-col="2" aria-pressed="false"></button>
        <button type="button" data-row="2" data-col="0" aria-pressed="false"></button>
        <button type="button" data-row="2" data-col="1" aria-pressed="false"></button>
        <button type="button" data-row="2" data-col="2" aria-pressed="false"></button>
      </div>
    </div>
    <div class="row describe-row">
      <span class="row-label">Describe</span>
      <input type="text" class="describe" placeholder="e.g. top left, right side, middle" aria-label="Describe a position" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="80">
    </div>
    <div class="row">
      <span class="row-label">Measure from</span>
      <button type="button" data-ref="corner" aria-pressed="true">Top-left corner</button>
      <button type="button" data-ref="center" aria-pressed="false">Center</button>
    </div>
    <p class="info" role="status" aria-live="polite"></p>
    </div>
  </div>

  <div id="start">
    <button id="startButton" type="button">[ Tap to start ]</button>
    <p id="startMessage"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="audio.js"></script>
  <script src="snacks.js"></script>
  <script src="script.js"></script>
</body>
</html>
